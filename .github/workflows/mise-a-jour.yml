# Mise à jour automatique de la Randothèque, toutes les heures, depuis les deux blogs de Gé (photosge30132 et gr-ge-30132).
# Le site est envoyé par FTP chez o2switch : https://randotheque.anthony-bondon.fr/gerard-martine/
# Secrets du dépôt : FTP_HOST, FTP_USER, FTP_PASSWORD (compte FTP qui arrive à la racine du sous-domaine).
# GitHub Pages ne sert plus qu'à rediriger les anciennes adresses (liens partagés, gadget du blog).
name: Mise à jour horaire

on:
  schedule:
    # Toutes les heures à hh:07 (pas à l'heure pile : c'est là que GitHub retarde ou abandonne
    # le plus ses tâches programmées). Un passage sauté est rattrapé par le suivant.
    - cron: '7 * * * *'
  workflow_dispatch:        # bouton « Run workflow » pour lancer une mise à jour à la main
  push:
    branches: [main]

permissions:
  contents: write   # enregistrer les nouveaux GPX dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: randotheque-gerard-martine
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # le tout premier envoi FTP (2 000 fichiers) est long ; ensuite seuls les changements partent
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les nouveautés des deux blogs
        run: node scripts/scrape-blog.mjs

      - name: Générer les données du site
        run: node scripts/build.mjs

      - name: Récupérer les randos du blog Poulx (recherche « Chercher aussi sur », hors club)
        run: node scripts/scrape-poulx.mjs
        continue-on-error: true

      - name: Enregistrer les nouveaux fichiers dans le dépôt
        run: |
          git config user.name "Randothèque (mise à jour automatique)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gpx/blog audio data/blog-catalog.json .cache externes
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Mise à jour depuis les blogs du $(TZ=Europe/Paris date '+%d/%m/%Y à %Hh%M')"
            # Si le dépôt a bougé entre-temps, on garde nos fichiers fraîchement générés
            # (« -X theirs » désigne, pendant un rebase, le commit qu'on rejoue : le nôtre).
            for essai in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Nouvel essai d'enregistrement ($essai)…"; sleep 5
            done
          fi

      - name: Récupérer la liste des randos RandoGPS (recherche « Chercher aussi sur », hors club)
        run: node scripts/scrape-randogps.mjs
        continue-on-error: true

      - name: Préparer le site
        run: node scripts/build-site.mjs

      - name: Envoyer le site chez o2switch (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./gerard-martine/
          exclude: |
            **/.git*
            **/.git*/**

      # Garde-fou : on ne redirige GitHub Pages que si le nouveau site répond vraiment
      # (DNS, certificat HTTPS et fichiers en place). Sinon Pages garde la version précédente.
      - name: Vérifier que le nouveau site répond
        id: enligne
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://randotheque.anthony-bondon.fr/gerard-martine/" || echo 000)
          echo "https://randotheque.anthony-bondon.fr/gerard-martine/ : $code"
          if [ "$code" = "200" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Le nouveau site ne répond pas encore ($code) : GitHub Pages n'est pas redirigé pour l'instant."; fi

      # Anciennes adresses github.io : une page qui renvoie vers la même page sur le nouveau site
      # (chemin, recherche et #rando=… conservés), y compris dans l'iframe du compteur sur le blog.
      - name: Préparer la redirection depuis GitHub Pages
        if: steps.enligne.outputs.ok == 'true'
        run: |
          mkdir -p _redirect
          cat > _redirect/index.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <title>La Randothèque a déménagé</title>
          <script>
            var base = 'https://randotheque.anthony-bondon.fr/gerard-martine/';
            var rest = location.pathname.replace(/^\/[^\/]+\/?/, '');
            location.replace(base + rest + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=https://randotheque.anthony-bondon.fr/gerard-martine/"></head>
          <body><p>La Randothèque a déménagé : <a href="https://randotheque.anthony-bondon.fr/gerard-martine/">https://randotheque.anthony-bondon.fr/gerard-martine/</a></p></body></html>
          EOF
          for f in 404 compteur stats; do cp _redirect/index.html _redirect/$f.html; done
          touch _redirect/.nojekyll

      - uses: actions/configure-pages@v5
        if: steps.enligne.outputs.ok == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.enligne.outputs.ok == 'true'
        with:
          path: _redirect

      - name: Publier la redirection sur GitHub Pages
        if: steps.enligne.outputs.ok == 'true'
        id: deploiement
        uses: actions/deploy-pages@v4
