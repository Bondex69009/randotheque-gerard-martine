# Ce dépôt n'est plus utilisé : la Randothèque de Gérard & Martine vit maintenant dans le dépôt
# Bondex69009/randotheque (dossier gerard-martine/) et en ligne sur
# https://randotheque.anthony-bondon.fr/gerard-martine/
#
# Il ne sert plus qu'à une chose : rediriger les anciennes adresses
# bondex69009.github.io/randotheque-gerard-martine/… (liens partagés, favoris, appli installée)
# vers le nouveau site, chemin et #rando=… conservés. La redirection n'est publiée que
# lorsque le nouveau site répond ; d'ici là, GitHub Pages garde l'ancienne version.
name: Redirection vers le nouveau site

on:
  schedule:
    - cron: '17 */6 * * *'   # toutes les 6 heures, jusqu'à ce que le nouveau site réponde
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: redirection
  cancel-in-progress: false

env:
  NOUVEAU: https://randotheque.anthony-bondon.fr/gerard-martine/

jobs:
  redirection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Vérifier que le nouveau site répond
        id: enligne
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$NOUVEAU" || echo 000)
          echo "$NOUVEAU : $code"
          # La redirection ne change jamais : une fois en ligne, inutile de republier GitHub Pages à chaque
          # passage (le déploiement Pages échoue de temps en temps côté GitHub et envoie un mail d'échec).
          deja=$(curl -sS --max-time 20 "https://bondex69009.github.io/randotheque-gerard-martine/" || true)
          if echo "$deja" | grep -q "La Randothèque a déménagé" && echo "$deja" | grep -q "randotheque.anthony-bondon.fr/gerard-martine/"; then
            echo "La redirection est déjà en place sur GitHub Pages : rien à republier."
          elif [ "$code" = "200" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Le nouveau site ne répond pas encore ($code) : rien n'est changé sur GitHub Pages."; fi

      - name: Préparer la redirection
        if: steps.enligne.outputs.ok == 'true'
        run: |
          mkdir -p _redirect
          cat > _redirect/index.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <title>La Randothèque a déménagé</title>
          <script>
            var base = 'https://randotheque.anthony-bondon.fr/gerard-martine/';
            var rest = location.pathname.replace(/^\/[^\/]+\/?/, '');
            location.replace(base + rest + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=https://randotheque.anthony-bondon.fr/gerard-martine/"></head>
          <body><p>La Randothèque a déménagé : <a href="https://randotheque.anthony-bondon.fr/gerard-martine/">https://randotheque.anthony-bondon.fr/gerard-martine/</a></p></body></html>
          EOF
          for f in 404 compteur stats; do cp _redirect/index.html _redirect/$f.html; done
          touch _redirect/.nojekyll

      - uses: actions/configure-pages@v5
        if: steps.enligne.outputs.ok == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.enligne.outputs.ok == 'true'
        with:
          path: _redirect

      - name: Publier la redirection sur GitHub Pages
        if: steps.enligne.outputs.ok == 'true'
        id: deploiement
        uses: actions/deploy-pages@v4
        continue-on-error: true   # un raté de Pages ne doit pas marquer le run en échec
